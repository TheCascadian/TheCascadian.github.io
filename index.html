<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheCascadian</title>
<meta name="description" content="TheCascadian: game development, modding tools, and public repositories.">
<meta name="color-scheme" content="light dark">
<link rel="preload" href="fonts/ms_sans_serif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="site.css">
<script>
// Applied before first paint so the stored theme never flashes the default one.
(function () {
  var theme = null;
  try { theme = localStorage.getItem("theme"); } catch (error) { theme = null; }
  if (theme !== "day" && theme !== "night" && theme !== "classic") {
    theme = matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
  }
  document.documentElement.dataset.theme = theme;
})();
</script>
</head>
<body>

<main id="desktop" aria-label="Desktop">
  <nav id="icons" aria-label="Programs"></nav>
  <div id="windows"></div>
  <noscript>
    <section class="window static">
      <header class="titlebar"><span class="ttext">TheCascadian</span></header>
      <div class="wbody pad">
        <p>Lead UI/UX Designer and Game Developer in the Pacific Northwest. This site needs JavaScript for its window interface.</p>
        <p><a href="https://github.com/TheCascadian?tab=repositories">Repositories on GitHub</a></p>
        <p><a href="https://thecascadian.itch.io">itch.io</a> | <a href="https://modrinth.com/user/CascadianBuilder">Modrinth</a> | <a href="https://www.youtube.com/@SynphulHero">YouTube</a></p>
      </div>
    </section>
  </noscript>
</main>

<div id="startmenu" class="menu" role="menu" aria-label="Start menu" hidden></div>

<footer id="taskbar">
  <button id="start" class="btn" type="button" aria-haspopup="menu" aria-expanded="false"><span class="ico"></span><b>Start</b></button>
  <div id="tasks" role="tablist" aria-label="Open windows"></div>
  <div id="tray">
    <button id="themebtn" class="traybtn" type="button" title="Change theme"></button>
    <time id="clock"></time>
  </div>
</footer>

<script src="config.js"></script>
<script src="markdown.js"></script>
<script src="site.js"></script>
</body>
</html>
